<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#ddd6c8" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="#efeae0" />
  <rect width="1200" height="900" fill="url(#grid)" />

  <line x1="100" y1="180" x2="1100" y2="180" stroke="#c6bda9" stroke-width="2" />
  <line x1="100" y1="180" x2="240" y2="180" stroke="#a8431f" stroke-width="4" />

  <!-- funding bar: 60% raised, goal marked -->
  <rect x="140" y="430" width="920" height="140" fill="#f5f1e8" stroke="#1b1916" stroke-width="2.5" />
  <rect x="142" y="432" width="550" height="136" fill="#a8431f" />
  <g stroke="#f5f1e8" stroke-width="2" opacity="0.55">
    <line x1="322" y1="432" x2="322" y2="568" />
    <line x1="502" y1="432" x2="502" y2="568" />
  </g>
  <g stroke="#c6bda9" stroke-width="2">
    <line x1="692" y1="432" x2="692" y2="568" />
    <line x1="882" y1="432" x2="882" y2="568" />
  </g>

  <line x1="870" y1="340" x2="870" y2="620" stroke="#a8431f" stroke-width="2" stroke-dasharray="10 9" />
  <path d="M870 340 l72 22 l-72 22 z" fill="#a8431f" />
  <circle cx="692" cy="500" r="9" fill="#1b1916" />
  <line x1="692" y1="500" x2="870" y2="500" stroke="#1b1916" stroke-width="2" stroke-dasharray="6 8" />

  <!-- pledges -->
  <g fill="none" stroke="#1b1916" stroke-width="2.5">
    <circle cx="230" cy="700" r="42" />
    <circle cx="350" cy="700" r="42" />
    <circle cx="470" cy="700" r="42" />
  </g>
  <g fill="#a8431f">
    <circle cx="230" cy="700" r="6" />
    <circle cx="350" cy="700" r="6" />
    <circle cx="470" cy="700" r="6" />
  </g>

  <g stroke="#1b1916" stroke-width="2.5" stroke-linecap="round">
    <line x1="860" y1="676" x2="1060" y2="676" />
    <line x1="860" y1="708" x2="1000" y2="708" />
    <line x1="860" y1="740" x2="1030" y2="740" />
  </g>
</svg>
