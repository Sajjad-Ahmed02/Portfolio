<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#ddd6c8" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="#efeae0" />
  <rect width="1200" height="900" fill="url(#grid)" />

  <line x1="100" y1="180" x2="1100" y2="180" stroke="#c6bda9" stroke-width="2" />
  <line x1="100" y1="180" x2="250" y2="180" stroke="#a8431f" stroke-width="4" />

  <!-- source panel -->
  <rect x="120" y="230" width="620" height="500" fill="#f5f1e8" stroke="#1b1916" stroke-width="2.5" />
  <line x1="120" y1="296" x2="740" y2="296" stroke="#c6bda9" stroke-width="2" />
  <g fill="#1b1916">
    <rect x="148" y="256" width="14" height="14" />
    <rect x="176" y="256" width="14" height="14" />
  </g>
  <rect x="204" y="256" width="14" height="14" fill="#a8431f" />

  <g stroke="#1b1916" stroke-width="2.5" stroke-linecap="round">
    <line x1="160" y1="350" x2="420" y2="350" />
    <line x1="160" y1="398" x2="560" y2="398" />
    <line x1="160" y1="446" x2="500" y2="446" />
    <line x1="160" y1="542" x2="460" y2="542" />
    <line x1="160" y1="590" x2="540" y2="590" />
    <line x1="160" y1="638" x2="380" y2="638" />
  </g>

  <!-- the line under review -->
  <rect x="121" y="473" width="618" height="42" fill="#a8431f" opacity="0.14" />
  <line x1="121" y1="473" x2="121" y2="515" stroke="#a8431f" stroke-width="6" />
  <line x1="160" y1="494" x2="600" y2="494" stroke="#a8431f" stroke-width="2.5" stroke-linecap="round" />

  <!-- review note -->
  <line x1="740" y1="494" x2="786" y2="494" stroke="#a8431f" stroke-width="2" stroke-dasharray="7 7" />
  <path d="M800 494 l-14 -8 v16 z" fill="#a8431f" />

  <rect x="800" y="330" width="280" height="330" fill="#f5f1e8" stroke="#1b1916" stroke-width="2.5" />
  <line x1="830" y1="380" x2="930" y2="380" stroke="#a8431f" stroke-width="4" stroke-linecap="round" />
  <line x1="950" y1="380" x2="1050" y2="380" stroke="#1b1916" stroke-width="2.5" stroke-linecap="round" />
  <g stroke="#c6bda9" stroke-width="2.5" stroke-linecap="round">
    <line x1="830" y1="424" x2="1040" y2="424" />
    <line x1="830" y1="462" x2="1010" y2="462" />
    <line x1="830" y1="500" x2="1050" y2="500" />
    <line x1="830" y1="538" x2="980" y2="538" />
  </g>
  <path
    d="M830 590 l16 16 l32 -34"
    fill="none"
    stroke="#a8431f"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <g stroke="#1b1916" stroke-width="2.5" stroke-linecap="round">
    <line x1="120" y1="790" x2="280" y2="790" />
    <line x1="120" y1="822" x2="210" y2="822" />
  </g>
</svg>
