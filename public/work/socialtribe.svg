<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#ddd6c8" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="#efeae0" />
  <rect width="1200" height="900" fill="url(#grid)" />

  <line x1="100" y1="170" x2="1100" y2="170" stroke="#c6bda9" stroke-width="2" />
  <line x1="100" y1="170" x2="260" y2="170" stroke="#a8431f" stroke-width="4" />

  <!-- connections -->
  <g stroke="#1b1916" stroke-width="2">
    <line x1="250" y1="470" x2="470" y2="300" />
    <line x1="250" y1="470" x2="470" y2="640" />
    <line x1="250" y1="470" x2="700" y2="460" />
    <line x1="470" y1="300" x2="700" y2="460" />
    <line x1="470" y1="640" x2="700" y2="460" />
    <line x1="700" y1="460" x2="960" y2="300" />
    <line x1="700" y1="460" x2="980" y2="620" />
    <line x1="960" y1="300" x2="980" y2="620" />
  </g>
  <g stroke="#c6bda9" stroke-width="2" stroke-dasharray="8 9">
    <line x1="470" y1="300" x2="960" y2="300" />
    <line x1="470" y1="640" x2="980" y2="620" />
    <line x1="250" y1="470" x2="980" y2="620" />
  </g>

  <!-- members -->
  <g fill="#f5f1e8" stroke="#1b1916" stroke-width="2.5">
    <circle cx="250" cy="470" r="58" />
    <circle cx="470" cy="300" r="44" />
    <circle cx="470" cy="640" r="44" />
    <circle cx="960" cy="300" r="44" />
    <circle cx="980" cy="620" r="58" />
  </g>

  <!-- the organisation at the centre -->
  <circle cx="700" cy="460" r="118" fill="#a8431f" />
  <circle cx="700" cy="460" r="44" fill="none" stroke="#f5f1e8" stroke-width="2.5" />
  <circle cx="700" cy="460" r="10" fill="#f5f1e8" />

  <g fill="#1b1916">
    <circle cx="250" cy="470" r="8" />
    <circle cx="470" cy="300" r="8" />
    <circle cx="980" cy="620" r="8" />
  </g>
  <g fill="#a8431f">
    <circle cx="470" cy="640" r="8" />
    <circle cx="960" cy="300" r="8" />
  </g>

  <g stroke="#1b1916" stroke-width="2.5" stroke-linecap="round">
    <line x1="140" y1="760" x2="300" y2="760" />
    <line x1="140" y1="792" x2="230" y2="792" />
  </g>
</svg>
